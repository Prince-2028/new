name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"
  BACKEND_EXE_NAME: "SmartAppBackend.exe"

jobs:
  build-desktop:
    name: Build Backend, Frontend and Electron Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. Validate backend files
      - name: Check Backend Files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeter1/requirements.txt")) {
            throw "smartmeter1/requirements.txt not found"
          }

          if (!(Test-Path "smartmeter1/manage.py")) {
            throw "smartmeter1/manage.py not found"
          }

          Write-Host "Backend files verified."

      # 4. Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Pip upgrade failed"
          }

          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Backend dependency installation failed"
          }

          python -m pip install --upgrade pyinstaller pyinstaller-hooks-contrib
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller installation failed"
          }

      # 5. Verify backend dependencies
      - name: Verify Python Dependencies
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python --version
          python -m pip show Django djangorestframework PyInstaller

          python -c "import django; import rest_framework; import coloredlogs; print('Django, DRF and coloredlogs imports OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "Required backend imports failed"
          }

      # 6. Build backend EXE
      - name: Build Backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name SmartAppBackend `
            --paths . `
            --collect-all rest_framework `
            --collect-all coloredlogs `
            --collect-all humanfriendly `
            --collect-submodules django.contrib `
            --collect-submodules meter1 `
            --collect-submodules smartmeter1 `
            --hidden-import rest_framework.authentication `
            --hidden-import coloredlogs `
            --hidden-import humanfriendly `
            manage.py

          if ($LASTEXITCODE -ne 0) {
            throw "Backend EXE build failed"
          }

          if (!(Test-Path "dist/SmartAppBackend.exe")) {
            throw "dist/SmartAppBackend.exe was not created"
          }

          Write-Host "Backend EXE built successfully."

      # 7. Smoke test backend EXE
      - name: Verify Backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          & ".\dist\SmartAppBackend.exe" --version

          if ($LASTEXITCODE -ne 0) {
            throw "Backend EXE smoke test failed"
          }

          Write-Host "Backend EXE smoke test passed."

      # 8. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            smartmeterapp/package-lock.json
            electrons/package-lock.json

      # 9. Validate frontend and Electron files
      - name: Check Frontend and Electron Files
        shell: pwsh
        run: |
          $required = @(
            "smartmeterapp/package.json",
            "smartmeterapp/package-lock.json",
            "electrons/package.json",
            "electrons/main.js"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required file not found: $file"
            }
          }

          Write-Host "Frontend and Electron files verified."

      # 10. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: smartmeterapp
        shell: pwsh
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm ci failed"
          }

      # 11. Build React frontend
      - name: Build React Frontend
        working-directory: smartmeterapp
        shell: pwsh
        env:
          CI: "false"
        run: |
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "React build failed"
          }

          if (!(Test-Path "build/index.html")) {
            throw "React build/index.html not found"
          }

          Write-Host "React frontend built successfully."

      # 12. Prepare Electron application files
      - name: Prepare Electron Files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeterapp/build/index.html")) {
            throw "React frontend build is missing"
          }

          if (!(Test-Path "smartmeter1/dist/SmartAppBackend.exe")) {
            throw "Backend EXE is missing"
          }

          New-Item -ItemType Directory -Force "electrons/build" | Out-Null
          New-Item -ItemType Directory -Force "electrons/backend" | Out-Null

          Copy-Item `
            "smartmeterapp/build/*" `
            "electrons/build/" `
            -Recurse -Force

          Copy-Item `
            "smartmeter1/dist/SmartAppBackend.exe" `
            "electrons/backend/SmartAppBackend.exe" `
            -Force

          if (!(Test-Path "electrons/build/index.html")) {
            throw "Electron frontend copy failed"
          }

          if (!(Test-Path "electrons/backend/SmartAppBackend.exe")) {
            throw "Electron backend copy failed"
          }

          Write-Host "Electron files prepared successfully."

      # 13. Automatically prepare a valid Windows ICO
      - name: Prepare Electron App Icon Automatically
        shell: pwsh
        run: |
          python -m pip install Pillow

          if ($LASTEXITCODE -ne 0) {
            throw "Pillow installation failed"
          }

          $scriptPath = Join-Path $env:RUNNER_TEMP "prepare_electron_icon.py"

          @'
          import sys
          from pathlib import Path
          from PIL import Image

          candidates = [
              Path("smartmeterapp/public/logo512.png"),
              Path("smartmeterapp/public/logo192.png"),
              Path("smartmeterapp/public/favicon.png"),
              Path("smartmeterapp/public/favicon.ico"),
              Path("smartmeterapp/build/favicon.ico"),
          ]

          destination = Path("electrons/build/favicon.ico")
          source = next((p for p in candidates if p.is_file()), None)

          if source is None:
              raise SystemExit(
                  "No source icon found. Add a high-resolution image at "
                  "smartmeterapp/public/logo512.png or provide a favicon."
              )

          try:
              with Image.open(source) as original:
                  if original.format == "ICO":
                      available = original.ico.sizes()
                      if available:
                          largest = max(available, key=lambda s: s[0] * s[1])
                          image = original.ico.getimage(largest).convert("RGBA")
                      else:
                          image = original.convert("RGBA")
                  else:
                      image = original.convert("RGBA")

                  print(f"Icon source: {source}")
                  print(f"Source dimensions: {image.width}x{image.height}")

                  image = image.resize(
                      (256, 256),
                      Image.Resampling.LANCZOS
                  )

                  destination.parent.mkdir(parents=True, exist_ok=True)
                  image.save(
                      destination,
                      format="ICO",
                      sizes=[
                          (256, 256),
                          (128, 128),
                          (64, 64),
                          (48, 48),
                          (32, 32),
                          (16, 16),
                      ],
                  )

              with Image.open(destination) as result:
                  available = result.ico.sizes()
                  if not any(w >= 256 and h >= 256 for w, h in available):
                      raise SystemExit("Generated ICO does not contain a 256x256 image.")

              print(f"Electron icon generated: {destination}")
              print("Electron icon preparation successful.")

          except Exception as exc:
              raise SystemExit(f"Icon preparation failed: {exc}")
          '@ | Set-Content -Path $scriptPath -Encoding UTF8

          python $scriptPath

          if ($LASTEXITCODE -ne 0) {
            throw "Automatic Electron icon preparation failed"
          }

          if (!(Test-Path "electrons/build/favicon.ico")) {
            throw "Generated Electron icon is missing"
          }

      # 14. Install Electron dependencies
      - name: Install Electron Dependencies
        working-directory: electrons
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Electron dependency installation failed"
          }

      # 15. Verify Electron configuration
      - name: Verify Electron Configuration
        working-directory: electrons
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json

          if (!$package.main) {
            throw "package.json must define the Electron main entry point"
          }

          if (!(Test-Path $package.main)) {
            throw "Electron main file not found: $($package.main)"
          }

          if (!$package.scripts.dist) {
            throw "package.json must define the dist script"
          }

          $resources = @($package.build.extraResources)
          $backendResource = $resources | Where-Object {
            $_.to -eq "backend/SmartAppBackend.exe"
          }

          if (!$backendResource) {
            throw "Configure build.extraResources to copy backend/SmartAppBackend.exe into resources/backend/SmartAppBackend.exe"
          }

          Write-Host "Electron packaging configuration verified."

      # 16. Verify configured Electron icons
      - name: Check Electron Icons
        working-directory: electrons
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json

          $iconPaths = @(
            $package.build.icon,
            $package.build.win.icon,
            $package.build.nsis.installerIcon,
            $package.build.nsis.uninstallerIcon
          )

          foreach ($iconPath in $iconPaths) {
            if ($iconPath -and !(Test-Path $iconPath)) {
              throw "Configured icon not found: $iconPath"
            }
          }

          if (!(Test-Path "build/favicon.ico")) {
            throw "Prepared build/favicon.ico is missing"
          }

          python -c "from PIL import Image; p=Image.open('build/favicon.ico'); s=p.ico.sizes(); print('ICO sizes:', s); assert any(w >= 256 and h >= 256 for w,h in s), 'ICO must contain a 256x256 image'"

          if ($LASTEXITCODE -ne 0) {
            throw "Electron ICO validation failed"
          }

          Write-Host "Electron icon checks passed."

      # 17. Build Windows installer
      - name: Build Electron Installer
        working-directory: electrons
        shell: pwsh
        run: |
          npm run dist

          if ($LASTEXITCODE -ne 0) {
            throw "Electron installer build failed"
          }

          if (!(Test-Path "dist")) {
            throw "Electron dist directory not found"
          }

          $installers = @(
            Get-ChildItem "dist/*.exe" -File |
            Where-Object { $_.Name -notlike "win-unpacked*" }
          )

          if ($installers.Count -eq 0) {
            throw "No Windows installer EXE found"
          }

          Write-Host "Installer files created:"
          $installers | ForEach-Object {
            Write-Host $_.FullName
          }

      # 18. Upload only the final installer
      - name: Upload Final Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Windows-Installer
          path: electrons/dist/*.exe
          if-no-files-found: error
          retention-days: 7
