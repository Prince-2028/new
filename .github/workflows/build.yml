
name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build Backend, Frontend and Electron Installer
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Check actual backend files
      - name: Check backend files
        shell: pwsh
        run: |
          Write-Host "Checking smartmeter1 folder..."
          Get-ChildItem smartmeter1

          if (!(Test-Path "smartmeter1/requirements.txt")) {
            throw "smartmeter1/requirements.txt not found"
          }

      # 4. Install backend dependencies
      - name: Install backend dependencies
        working-directory: smartmeter1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # 5. Build backend EXE
      # Assumes smartmeter1/manage.spec exists
      - name: Build backend EXE
        working-directory: smartmeter1
        run: |
          if (Test-Path "manage.spec") {
            python -m PyInstaller --clean --onefile --name smartmeter1 --distpath build --workpath temp_build manage.py
          } else {
            throw "manage.spec not found in smartmeter1. Update this step to use your actual PyInstaller command."
          }

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 7. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: smartmeterapp
        run: npm ci

      # 8. Build React frontend
      - name: Build frontend
        working-directory: smartmeterapp
        run: npm run build
        env:
          CI: "false"

      # 9. Prepare Electron files
      # Assumes Electron folder is named electron/
      # and PyInstaller generates smartmeter1/dist/manage.exe
      - name: Prepare Electron files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeterapp/build/index.html")) {
            throw "React build not found"
          }

          if (!(Test-Path "smartmeter1/dist/manage.exe")) {
            throw "Backend EXE not found at smartmeter1/dist/manage.exe"
          }

          New-Item -ItemType Directory -Force `
            "electron/frontend/build" | Out-Null

          New-Item -ItemType Directory -Force `
            "electron/backend" | Out-Null

          Copy-Item "smartmeterapp/build/*" `
            "electron/frontend/build/" -Recurse -Force

          Copy-Item "smartmeter1/dist/manage.exe" `
            "electron/backend/manage.exe" -Force

      # 10. Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # 11. Build final Windows installer
      - name: Build Electron installer
        working-directory: electron
        run: npm run dist

      # 12. Upload ONLY final Electron EXE
      - name: Upload Final Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Windows-Installer
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 7
