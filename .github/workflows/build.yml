name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build Backend, Frontend and Electron Installer
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Check backend files
      - name: Check backend files
        shell: pwsh
        run: |
          Get-ChildItem smartmeter1

          if (!(Test-Path "smartmeter1/requirements.txt")) {
            throw "smartmeter1/requirements.txt not found"
          }

          if (!(Test-Path "smartmeter1/manage.py")) {
            throw "smartmeter1/manage.py not found"
          }

      # 4. Install backend dependencies
      - name: Install backend dependencies
        working-directory: smartmeter1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # 5. Build backend EXE directly inside build/
      - name: Build backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --onefile `
            --name smartmeter1 `
            --distpath build `
            --workpath temp_build `
            --specpath temp_build `
            manage.py

          if (!(Test-Path "build/smartmeter1.exe")) {
            throw "Backend EXE build failed"
          }

          Write-Host "Backend EXE created successfully:"
          Get-Item "build/smartmeter1.exe"

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 7. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: smartmeterapp
        run: npm ci

      # 8. Build React frontend
      - name: Build frontend
        working-directory: smartmeterapp
        run: npm run build
        env:
          CI: "false"

      # 9. Prepare Electron files
      - name: Prepare Electron files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeterapp/build/index.html")) {
            throw "React build not found"
          }

          if (!(Test-Path "smartmeter1/build/smartmeter1.exe")) {
            throw "Backend EXE not found"
          }

          New-Item -ItemType Directory -Force `
            "electron/frontend/build" | Out-Null

          New-Item -ItemType Directory -Force `
            "electron/backend" | Out-Null

          Copy-Item "smartmeterapp/build/*" `
            "electron/frontend/build/" -Recurse -Force

          Copy-Item "smartmeter1/build/smartmeter1.exe" `
            "electron/backend/manage.exe" -Force

          Write-Host "Electron files prepared successfully"

            # 10. Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electron
        shell: pwsh
        run: |
          Write-Host "Checking Electron package files..."
          Get-ChildItem -Force

          if (!(Test-Path "package.json")) {
            throw "electron/package.json not found"
          }

          if (Test-Path "package-lock.json") {
            Write-Host "package-lock.json found. Running npm ci..."
            npm ci
          } else {
            Write-Host "package-lock.json not found in electron folder. Running npm install..."
            npm install
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Electron dependency installation failed"
          }

      # 11. Build final Windows installer
      - name: Build Electron installer
        working-directory: electron
        run: npm run dist

      # 12. Upload final Windows installer
      - name: Upload Final Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Windows-Installer
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 7
