name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:



env:
  # Local pe jo Python version use karte ho wahi yahan rakho
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build-desktop:
    name: Build Backend, Frontend and Electron Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: smartmeter1/requirements.txt

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            smartmeterapp/package-lock.json
            electrons/package-lock.json

      # 4. Backend: install dependencies
      - name: Install Backend Dependencies
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed" }
          python -m pip install --upgrade pyinstaller pyinstaller-hooks-contrib
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed" }

      # 5. Backend: build EXE
      # NOTE: flags ko apne local build command se match karo (add-data, spec file, etc.)
      - name: Build Backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name SmartAppBackend `
            --paths . `
            --collect-all rest_framework `
            --collect-all coloredlogs `
            --collect-all humanfriendly `
            --collect-submodules django.contrib `
            --collect-submodules meter1 `
            --collect-submodules smartmeter1 `
            --hidden-import rest_framework.authentication `
            --hidden-import coloredlogs `
            --hidden-import humanfriendly `
            manage.py
          if ($LASTEXITCODE -ne 0) { throw "Backend EXE build failed" }
          if (!(Test-Path "dist/SmartAppBackend.exe")) { throw "dist/SmartAppBackend.exe was not created" }

    
      # 7. Frontend: install + build
      - name: Install Frontend Dependencies
        working-directory: smartmeterapp
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Frontend npm ci failed" }

      - name: Build React Frontend
        working-directory: smartmeterapp
        shell: pwsh
        env:
          CI: "false"
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "React build failed" }
          if (!(Test-Path "build/index.html")) { throw "React build/index.html not found" }

      # 8. Copy frontend build + backend EXE into electrons/
      - name: Prepare Electron Files
        shell: pwsh
        run: |
          if (Test-Path "electrons/build") { Remove-Item "electrons/build" -Recurse -Force }
          New-Item -ItemType Directory -Force "electrons/build" | Out-Null
          New-Item -ItemType Directory -Force "electrons/backend" | Out-Null

          Copy-Item "smartmeterapp/build/*" "electrons/build/" -Recurse -Force
          Copy-Item "smartmeter1/dist/SmartAppBackend.exe" "electrons/backend/SmartAppBackend.exe" -Force

          if (!(Test-Path "electrons/build/index.html")) { throw "Frontend copy failed" }
          if (!(Test-Path "electrons/backend/SmartAppBackend.exe")) { throw "Backend copy failed" }

      # 9. Electron: install dependencies
      - name: Install Electron Dependencies
        working-directory: electrons
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { throw "Electron dependency installation failed" }

      # 10. Generate Windows icon OUTSIDE build/ (React build isse overwrite nahi kar sakta)
      - name: Generate Windows Icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed" }

          $scriptPath = Join-Path $env:RUNNER_TEMP "make_icon.py"

          @'
          from pathlib import Path
          from PIL import Image

          candidates = [
              Path("smartmeterapp/public/logo512.png"),
              Path("smartmeterapp/public/logo192.png"),
              Path("smartmeterapp/public/favicon.png"),
              Path("smartmeterapp/public/favicon.ico"),
          ]
          dest = Path("electrons/assets/icon.ico")

          src = next((p for p in candidates if p.is_file()), None)
          if src is None:
              raise SystemExit("No source icon found in smartmeterapp/public/")

          with Image.open(src) as im:
              if im.format == "ICO":
                  largest = max(im.ico.sizes(), key=lambda s: s[0] * s[1])
                  img = im.ico.getimage(largest).convert("RGBA")
              else:
                  img = im.convert("RGBA")

          print(f"Icon source: {src} ({img.width}x{img.height})")
          img = img.resize((256, 256), Image.Resampling.LANCZOS)

          dest.parent.mkdir(parents=True, exist_ok=True)
          img.save(dest, format="ICO",
                   sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])

          with Image.open(dest) as r:
              sizes = r.ico.sizes()
              print("ICO sizes:", sorted(sizes))
              assert (256, 256) in sizes, "ICO missing 256x256"
          print("Icon generated:", dest)
          '@ | Set-Content -Path $scriptPath -Encoding UTF8

          python $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }

      # 11. Verify electron config
      - name: Verify Electron Configuration
        working-directory: electrons
        shell: pwsh
        run: |
          $raw = Get-Content "package.json" -Raw
          $package = $raw | ConvertFrom-Json

          if (!$package.main -or !(Test-Path $package.main)) { throw "Electron main file missing" }
          if (!$package.scripts.dist) { throw "package.json must define the dist script" }

          # build/ folder React ka hai, icon wahan se mat lo
          if ($raw -match "favicon") {
            throw "package.json mein 'favicon' reference mila. Saare icon paths 'assets/icon.ico' pe set karo."
          }

          $backendResource = @($package.build.extraResources) | Where-Object { $_.to -eq "backend/SmartAppBackend.exe" }
          if (!$backendResource) {
            throw "build.extraResources mein backend/SmartAppBackend.exe -> backend/SmartAppBackend.exe configure karo"
          }

          Write-Host "Electron configuration verified."

      # 12. Build installer
      # icon explicitly pass kiya hai taaki package.json ka koi purana path use na ho
      - name: Build Electron Installer
        working-directory: electrons
        shell: pwsh
        run: |
          npm run dist -- --config.icon=assets/icon.ico --config.win.icon=assets/icon.ico
          if ($LASTEXITCODE -ne 0) { throw "Electron installer build failed" }

          $installers = @(Get-ChildItem "dist/*.exe" -File)
          if ($installers.Count -eq 0) { throw "No Windows installer EXE found" }

          Write-Host "Installer files created:"
          $installers | ForEach-Object { Write-Host $_.FullName }

      # 13. Upload installer
      - name: Upload Final Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Windows-Installer
          path: electrons/dist/*.exe
          if-no-files-found: error
          retention-days: 7