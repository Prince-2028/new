
name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - dev-krish

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart MeterApp/package-lock.json

      - name: Install frontend dependencies
        working-directory: "Smart MeterApp"
        run: npm ci

      - name: Build frontend
        working-directory: "Smart MeterApp"
        run: npm run build

      - name: Frontend build success message
        if: success()
        run: echo "Frontend build successful!"
