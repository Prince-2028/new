name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp

jobs:
  frontend-build:
    name: Build Smart MeterApp Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smartmeterapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: smartmeterapp
        run: npm ci

      - name: Build frontend
        working-directory: smartmeterapp
        run: npm run build
        env:
          CI: "false"

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smartmeterapp-frontend-build
          path: smartmeterapp/build/
          if-no-files-found: error
          retention-days: 7