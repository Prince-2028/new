name: Build and Upload DLMS Backend EXE

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  BACKEND_EXE_NAME: "SmartAppBackend.exe"

jobs:
  build-backend:
    name: Build Django Backend EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: smartmeter1/requirements.txt

      # 3. Verify backend files
      - name: Check Backend Files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeter1/requirements.txt")) {
            throw "smartmeter1/requirements.txt not found"
          }

          if (!(Test-Path "smartmeter1/manage.py")) {
            throw "smartmeter1/manage.py not found"
          }

          Write-Host "Backend files verified."

      # 4. Install Python dependencies
      - name: Install Backend Dependencies
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python --version

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Pip upgrade failed"
          }

          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Backend dependency installation failed"
          }

          python -m pip install --upgrade pyinstaller pyinstaller-hooks-contrib
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller installation failed"
          }

      # 5. Verify important dependencies
      - name: Verify Backend Dependencies
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -c "import django; import rest_framework; import coloredlogs; print('Backend imports OK')"

          if ($LASTEXITCODE -ne 0) {
            throw "Backend imports failed"
          }

      # 6. Build a single backend EXE
      - name: Build Backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name SmartAppBackend `
            --paths . `
            --collect-all rest_framework `
            --collect-all coloredlogs `
            --collect-all humanfriendly `
            --collect-submodules django.contrib `
            --collect-submodules meter1 `
            --collect-submodules smartmeter1 `
            --hidden-import rest_framework.authentication `
            --hidden-import coloredlogs `
            --hidden-import humanfriendly `
            manage.py

          if ($LASTEXITCODE -ne 0) {
            throw "Backend EXE build failed"
          }

          if (!(Test-Path "dist/SmartAppBackend.exe")) {
            throw "SmartAppBackend.exe was not created"
          }

          Write-Host "Backend EXE built successfully."

      # 7. Smoke test the EXE
      - name: Verify Backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          & ".\dist\SmartAppBackend.exe" --version

          if ($LASTEXITCODE -ne 0) {
            throw "Backend EXE smoke test failed"
          }

          Write-Host "Backend EXE smoke test passed."

      # 8. Copy only the EXE to a clean output folder
      - name: Prepare Backend Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "output" | Out-Null

          Copy-Item `
            "smartmeter1/dist/SmartAppBackend.exe" `
            "output/SmartAppBackend.exe" `
            -Force

          if (!(Test-Path "output/SmartAppBackend.exe")) {
            throw "Final backend EXE not found"
          }

          $file = Get-Item "output/SmartAppBackend.exe"

          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      # 9. Upload only the backend EXE
      - name: Upload Backend EXE
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Backend-EXE
          path: output/SmartAppBackend.exe
          if-no-files-found: error
          retention-days: 7
