
name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:



jobs:
  build-desktop:
    name: Build Backend, Frontend and Electron Installer
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Check backend files
      - name: Check backend files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeter1/requirements.txt")) {
            throw "smartmeter1/requirements.txt not found"
          }

          if (!(Test-Path "smartmeter1/manage.py")) {
            throw "smartmeter1/manage.py not found"
          }

          Write-Host "Backend files found successfully."

      # 4. Install backend dependencies
      - name: Install backend dependencies
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip"
          }

          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Backend dependency installation failed"
          }

          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller installation failed"
          }

      # 5. Build Django backend EXE
      - name: Build backend EXE
        working-directory: smartmeter1
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --onefile `
            --name smartmeter1 `
            --distpath build `
            --workpath temp_build `
            --specpath temp_build `
            manage.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller backend build failed"
          }

          if (!(Test-Path "build/smartmeter1.exe")) {
            throw "Backend EXE not found"
          }

          Write-Host "Backend EXE created successfully."

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 7. Check frontend files
      - name: Check frontend files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeterapp/package.json")) {
            throw "smartmeterapp/package.json not found"
          }

          if (!(Test-Path "smartmeterapp/package-lock.json")) {
            throw "smartmeterapp/package-lock.json not found. Commit the lock file or use npm install."
          }

      # 8. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: smartmeterapp
        shell: pwsh
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm ci failed"
          }

      # 9. Build React frontend
      - name: Build frontend
        working-directory: smartmeterapp
        shell: pwsh
        env:
          CI: "false"
        run: |
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "React frontend build failed"
          }

          if (!(Test-Path "build/index.html")) {
            throw "React build/index.html not found"
          }

          Write-Host "Frontend build completed successfully."

      # 10. Prepare Electron application files
      - name: Prepare Electron files
        shell: pwsh
        run: |
          if (!(Test-Path "smartmeterapp/build/index.html")) {
            throw "React build not found"
          }

          if (!(Test-Path "smartmeter1/build/smartmeter1.exe")) {
            throw "Backend EXE not found"
          }

          if (!(Test-Path "electrons/package.json")) {
            throw "electrons/package.json not found"
          }

          New-Item -ItemType Directory -Force "electrons/build" | Out-Null
          New-Item -ItemType Directory -Force "electrons/backend" | Out-Null

          Copy-Item `
            "smartmeterapp/build/*" `
            "electrons/build/" `
            -Recurse -Force

          Copy-Item `
            "smartmeter1/build/smartmeter1.exe" `
            "electrons/backend/SmartAppBackend.exe" `
            -Force

          if (!(Test-Path "electrons/build/index.html")) {
            throw "Electron frontend files were not copied"
          }

          if (!(Test-Path "electrons/backend/SmartAppBackend.exe")) {
            throw "Electron backend EXE was not copied"
          }

          Write-Host "Electron files prepared successfully."
          Get-ChildItem "electrons/build" -Force
          Get-ChildItem "electrons/backend" -Force

      # 11. Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electrons
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "electrons/package.json not found"
          }

          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Electron dependency installation failed"
          }

      # 12. Verify Electron icon, if configured
      - name: Check Electron icon
        working-directory: electrons
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json

          $iconPaths = @(
            $package.build.icon,
            $package.build.win.icon,
            $package.build.nsis.installerIcon,
            $package.build.nsis.uninstallerIcon
          )

          foreach ($iconPath in $iconPaths) {
            if ($iconPath -and !(Test-Path $iconPath)) {
              throw "Configured Electron icon not found: $iconPath. Add the icon file or remove the missing icon setting from package.json."
            }
          }

          Write-Host "Electron icon configuration checked."

      # 13. Build final Windows installer
      - name: Build Electron installer
        working-directory: electrons
        shell: pwsh
        run: |
          npm run dist

          if ($LASTEXITCODE -ne 0) {
            throw "Electron installer build failed"
          }

          if (!(Test-Path "dist")) {
            throw "Electron dist folder was not created"
          }

          $installer = Get-ChildItem "dist/*.exe" -File

          if (!$installer) {
            throw "No Windows installer EXE found in electrons/dist"
          }

          Write-Host "Installer created successfully:"
          $installer | ForEach-Object { Write-Host $_.FullName }

      # 14. Upload final Windows installer
      - name: Upload Final Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Windows-Installer
          path: electrons/dist/*.exe
          if-no-files-found: error
          retention-days: 7
