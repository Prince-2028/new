
name: Integrate CI/CD Pipeline for DLMS

on:
  push:
    branches:
      - smartapp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build Backend, Frontend and Electron EXE
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python for backend EXE
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install backend dependencies
      # Assumes backend/requirements.txt exists
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. Build backend EXE
      # Assumes backend/manage.spec exists
      - name: Build backend EXE
        working-directory: backend
        run: |
          pyinstaller --noconfirm --clean manage.spec

      # 5. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: smartmeterapp
        run: npm ci

      # 7. Build React frontend
      - name: Build frontend
        working-directory: smartmeterapp
        run: npm run build
        env:
          CI: "false"

      # 8. Copy backend EXE and frontend build into Electron
      # Assumes Electron main.js expects:
      # electron/backend/manage.exe
      # electron/frontend/build/
      - name: Prepare Electron files
        shell: pwsh
        run: |
          if (!(Test-Path "backend/dist/manage.exe")) {
            throw "Backend EXE not found"
          }

          if (!(Test-Path "smartmeterapp/build/index.html")) {
            throw "Frontend build not found"
          }

          New-Item -ItemType Directory -Force `
            "electron/backend" | Out-Null

          New-Item -ItemType Directory -Force `
            "electron/frontend/build" | Out-Null

          Copy-Item "backend/dist/manage.exe" `
            "electron/backend/manage.exe" -Force

          Copy-Item "smartmeterapp/build/*" `
            "electron/frontend/build/" -Recurse -Force

      # 9. Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # 10. Build final Windows installer
      - name: Build Electron installer
        working-directory: electron
        run: npm run dist

      # 11. Upload ONLY final Electron EXE
      - name: Upload Final Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Windows-Installer
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 7
